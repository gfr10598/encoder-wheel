# Magnet pocket generator configuration
magnet:
  radial_mm: 4.62   # 0.1819 inches
  tangential_mm: 9.46   # 0.3726 inches
  axial_mm: 19.0  # .7479 inches
  edge_radius_radial_mm: 0.5
  edge_radius_other_mm: 0.2
# These are the frame specs.
holder:
  material: PETG
  magnet_count: 32
  ID_mm: 132.4
  thickness_mm: 8.0
  end_face_mm: 2.0
  clearance_mm: 0.1  # Each side will half of this clearance.
  inset_mm: 0.5  # Radial gap between bore (R_i) and pocket inner face.
# Tilted end-face insertion opening and lead-in frustum.
insertion:
  taper_in_mm: 2.0      # setback from +Z end face where frustum starts
  taper_len_mm: 5.0     # axial length of the lead-in taper
  taper_expand_mm: 1.0  # expansion per side for the lead-in taper
  cutter_z_mm: 2.0      # insertion cutter centre Z in cell frame
  rim_target_mm: 1.6    # desired end-face rim thickness (mm)